name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 3.1.74

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---- Engine: compile the GPL C sources in engine/ to WebAssembly ----
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        run: |
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          fi
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build engine
        run: |
          source ~/emsdk/emsdk_env.sh
          npm run build-engine

      # ---- Web app + bundled Freedoom ----
      - name: Install npm dependencies
        run: npm ci

      - name: Cache Freedoom
        uses: actions/cache@v4
        with:
          path: build/freedoom
          key: freedoom-0.13.0

      - name: Fetch Freedoom (BSD-3-Clause, checksum verified)
        run: npm run fetch-freedoom

      - name: Assemble web app
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      # ---- Android ----
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the debug keystore from the DEBUG_KEYSTORE_B64 secret."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing; release APKs must use the fixed key."
            exit 1
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set: this APK gets a throwaway key and will not install over other builds."
          fi

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="WADRunner-${GITHUB_REF_NAME}.apk"; else name="WADRunner-build${GITHUB_RUN_NUMBER}.apk"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" \
              --title "WAD Runner $GITHUB_REF_NAME" \
              --notes "Android APK. Download it on your phone and open it to install. Includes Freedoom (BSD); bring your own WADs for Doom/Doom II. Source: this repository (GPL-2.0)."
          fi
